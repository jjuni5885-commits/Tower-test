<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타워 디펜스 테스트</title>
<style>
:root { --bg:#14110d; --card:#221d17; --ink:#f3ece0; --sub:#d8ccb8; --line:#3a3128; --gold:#e0a25c; --cyan:#45d6ea; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; line-height:1.6; }
main { max-width:560px; margin:0 auto; padding:28px 16px 48px; display:grid; gap:18px; }
h1 { font-size:24px; margin:0; }
p { margin:0; color:var(--sub); }
a.card { display:grid; gap:4px; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
a.card:active { transform:scale(0.99); }
.name { font-size:20px; font-weight:700; }
.t a.card { border-left:5px solid var(--gold); }
.go { margin-top:6px; font-weight:700; color:var(--gold); }
.c2 .go { color:var(--cyan); }
.c2 { border-left:5px solid var(--cyan) !important; }
.c1 { border-left:5px solid var(--gold) !important; }
.note { background:var(--card); border-radius:12px; padding:14px; font-size:15px; }
.note b { color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>타워 디펜스 테스트</h1>
  <p>휴대폰에서 바로 열립니다. 설치는 필요 없습니다.</p>

  <a class="card c1" href="timeflex/">
    <span class="name">타임플렉스: 시간 전쟁</span>
    <span>원시 시대부터 우주까지, 15개 시대를 막아 내는 타워 디펜스</span>
    <span class="go">플레이하기</span>
  </a>

  <a class="card c2" href="towerflex/">
    <span class="name">타워플렉스: 차원전쟁</span>
    <span>땅, 바다, 하늘로 몰려오는 적을 막는 타워 디펜스</span>
    <span class="go">플레이하기</span>
  </a>

  <div class="note">
    <b>해 보고 알려 주세요</b><br>
    어느 장, 몇 판에서 막혔는지 / 너무 쉬웠는지 / 이상하게 보이거나 멈춘 화면이 있었는지. 링크를 보내 준 사람에게 편하게 말해 주면 됩니다.<br>
    진행 기록은 이 휴대폰 브라우저에 저장됩니다. 새 버전이 올라와도 같은 링크로 들어오면 이어서 할 수 있습니다.
  </div>
</main>
</body>
</html>
